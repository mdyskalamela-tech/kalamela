<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Kalamela</title>
<meta name="description" content="Your Kalamela events, stages and times, live.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#7C0626">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  body{background:var(--bg)}
  .me-top{background:var(--top);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 26px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(60,6,22,.22)}
  .me-top .in{max-width:640px;margin:0 auto;display:flex;gap:14px;align-items:center}
  .me-top .logo-badge{width:58px;height:58px;border-radius:13px}
  .me-top .logo-badge img{width:50px;height:50px}
  .me-top{position:relative;overflow:hidden}
  .me-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--k-maroon) 0 25%,var(--k-yellow) 25% 50%,var(--k-teal) 50% 75%,var(--k-orange) 75%)}
  .me-top h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
  .me-top .sub{font-size:13.5px;opacity:.85;white-space:pre-line;line-height:1.35}
  .me{max-width:640px;margin:0 auto;padding:16px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .lookup input{width:100%}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .lookup label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
  .lookup .row{display:flex;gap:8px}
  .lookup input{flex:1;min-width:0;min-height:50px;font-size:22px;font-family:var(--f-mono);padding:8px 12px;border-radius:10px}
  .lookup .go{min-width:54px;min-height:50px;border-radius:10px;justify-content:center;padding:0 14px}
  .lookup .go svg{width:22px;height:22px}
  #intro{margin:10px 0 0;font-size:13px;color:var(--muted)}
  .chestcard{display:flex;gap:12px;align-items:center}
  .chestcard .av{width:46px;height:46px;border-radius:50%;background:var(--rose);color:var(--maroon);display:grid;place-items:center;flex:none}
  .chestcard .av svg{width:24px;height:24px}
  .chestcard .no{font-family:var(--f-mono);font-size:22px;font-weight:700}
  .chestcard .btn{margin-left:auto}
  .next{background:var(--rose);border:1px solid color-mix(in srgb,var(--maroon-2) 30%,var(--line));border-radius:16px;padding:16px;display:grid;gap:6px}
  .next.now{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .next .k{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--maroon);font-size:15px}
  .next.now .k{color:var(--ok)}
  .next .k svg{width:20px;height:20px}
  .next .eta{margin-left:auto;background:#FFE7C2;color:#8A4B00;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .next .ev{font-size:clamp(20px,5vw,24px);font-weight:700;line-height:1.2}
  .next .go{font-size:16px}
  .next .go b{color:var(--maroon)}
  .next.now .go b{color:var(--ok)}
  .sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px}
  .sec h2{font-size:19px;color:var(--maroon)}
  .evlist{padding:4px 0;overflow:hidden}
  .evrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
  .evrow:last-child{border-bottom:0}
  .evrow .st svg{width:24px;height:24px}
  .evrow.done .st{color:var(--ok)}.evrow.active .st{color:var(--bad)}.evrow.next .st{color:var(--maroon)}.evrow.pending .st{color:var(--line-strong)}
  .evrow.active{background:var(--ok-bg)}
  .evrow .t{font-weight:600}
  .evrow .s{font-size:13px;color:var(--muted)}
  .evrow .s b{color:var(--ink);font-weight:600}
  .evrow .tag{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
  .evrow.active .tag{color:var(--ok)}
  .evrow.next .tag{color:var(--maroon)}
  .me-footer{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px}
</style>
</head>
<body>
<header class="me-top">
  <div class="in">
    <span class="logo-badge"><img src="img/kalamela-logo.png" alt="Kalamela logo" width="50" height="50"></span>
    <div><h1 id="siteTitle">My Kalamela</h1><div class="sub" id="siteSub">Participant portal</div></div>
  </div>
</header>
<main class="me">
  <form class="mcard lookup" id="f"><label for="chest">Enter chest number</label>
    <div class="row"><input class="txt" id="chest" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="e.g. 1012" autocomplete="off">
    <button class="btn primary go" type="submit" aria-label="Show my events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></div>
    <p id="intro">Type the chest number on your admit card, or scan the QR code on it. This page updates by itself.</p></form>
  <div id="out" aria-live="polite"></div>
  <div class="me-footer">Keep this page open during the event for live stage updates · MDYS Mumbai Diocese</div>
</main>
<script type="module" src="js/me.js"></script>
</body>
</html>
